<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restaurant Table Reservation</title>
    
    <!-- Script to catch invalid URL navigations and redirect to My Bookings -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          if (e.message && e.message.includes("Failed to construct 'URL'")) {
            window.location.pathname = '/my-bookings';
          }
        });
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
